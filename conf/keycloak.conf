# # Basic settings for running in production on Railway.

# # Database Configuration
# # Using environment variables set by Railway

# db=postgres
# db-url=${KC_DB_URL:jdbc:postgresql://localhost/keycloak}
# db-username=${KC_DB_USERNAME:keycloak}
# db-password=${KC_DB_PASSWORD:password}

# # HTTP Configuration for Railway
# http-enabled=true
# http-port=${KC_HTTP_PORT:8080}

# # Hostname Configuration
# # Set via Railway environment variable or use default
# hostname=${KC_HOSTNAME:localhost}
# hostname-strict=false
# hostname-strict-https=false

# # Proxy Configuration (Railway uses reverse proxy)
# proxy=reencrypt
# proxy-headers=forwarded

# HTTPS Configuration
# Railway handles SSL termination, so we use HTTP internally
# https-certificate-file=
# https-certificate-key-file=

# # Observability & Health Checks

# # If the server should expose healthcheck endpoints.
# health-enabled=true

# # If the server should expose metrics endpoints.
# metrics-enabled=true

# # Sticky Session Configuration
# # Railway handles session affinity, so disable route attachment
# spi-sticky-session-encoder-infinispan-should-attach-route=false

# # Log Configuration
# log=console
# log-level=${KC_LOG_LEVEL:INFO}

# # Database connection pool settings for better performance
# db-pool-initial-size=10
# db-pool-max-size=20

# # Cache Configuration for distributed environments
# cache=ispn
# cache-config-file=${kc.home.dir}/conf/cache-ispn.xml




# # Basic settings for running in production. Change accordingly before deploying the server.

# # Database

# # The database vendor.
# #db=postgres

# # The username of the database user.
# #db-username=keycloak

# # The password of the database user.
# #db-password=password

# # The full database JDBC URL. If not provided, a default URL is set based on the selected database vendor.
# #db-url=jdbc:postgresql://localhost/keycloak

# # Observability

# # If the server should expose healthcheck endpoints.
# #health-enabled=true

# # If the server should expose metrics endpoints.
# #metrics-enabled=true

# # HTTP

# # The file path to a server certificate or certificate chain in PEM format.
# #https-certificate-file=${kc.home.dir}/conf/server.crt.pem

# # The file path to a private key in PEM format.
# #https-certificate-key-file=${kc.home.dir}/conf/server.key.pem

# # The proxy address forwarding mode if the server is behind a reverse proxy.
# #proxy=reencrypt

# # Do not attach route to cookies and rely on the session affinity capabilities from reverse proxy
# #spi-sticky-session-encoder-infinispan-should-attach-route=false

# # Hostname for the Keycloak server.
# #hostname=myhostname
