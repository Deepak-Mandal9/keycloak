name: Deploy to Railway

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: keycloak:test
      
      - name: Run security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: keycloak:test
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-to-railway:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Railway
        uses: MAT1G3R/railway-action@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          environment: production
      
      - name: Verify deployment
        run: |
          echo "Deployment started. Check Railway dashboard for status."
          echo "App URL: https://${{ secrets.RAILWAY_APP_NAME }}.railway.app"
      
      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.RAILWAY_APP_NAME }}.railway.app/health/ready || exit 1
        continue-on-error: true
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Keycloak deployment to Railway: ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  database-backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Backup PostgreSQL database
        run: |
          # This is a placeholder. Implement actual backup using Railway CLI or API
          echo "Backup triggered for production database"
        continue-on-error: true

  security-checks:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run YAML lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
      
      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate Dockerfile
        run: docker run --rm -i hadolint/hadolint < Dockerfile
